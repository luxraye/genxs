server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static frontend routing (Single-Page App)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API & Event Bus calls directly to Gateway
    location /api/ {
        proxy_pass http://gateway:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # SSE streaming support
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    # Reverse proxy Fabric and Public ledger calls
    location /public/ {
        proxy_pass http://gateway:3000/public/;
        proxy_set_header Host $host;
    }

    location /donations/ {
        proxy_pass http://gateway:3000/donations/;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://gateway:3000/healthz;
        proxy_set_header Host $host;
    }
}
