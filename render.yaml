services:
  # ─── 1. Bloodchain API Gateway & Unified Sovereign Suite ─────────────────────
  # Hosts the Express API Gateway, SSE Event Bus, IoT Ingestion, and Full Suite
  - type: web
    name: bloodchain-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: FABRIC_NODE_URL
        value: http://localhost:3001

  # ─── 2. Scyther: Citizen Donor Portal (Static Site) ──────────────────────────
  - type: web
    name: bloodchain-scyther
    runtime: static
    buildCommand: npm install && npm run build:scyther
    staticPublishPath: ./apps/scyther/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_GATEWAY_URL
        fromService:
          type: web
          name: bloodchain-gateway
          property: host

  # ─── 3. Rubric: National Operations Command (Static Site) ────────────────────
